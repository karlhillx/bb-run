[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bb-run"
version = "1.3.0"
description = "Run Bitbucket Pipelines locally in Docker or on your host"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Karl Hill", email = "karlhillx@gmail.com" }]
keywords = [
    "bitbucket",
    "pipelines",
    "ci",
    "cd",
    "docker",
    "devops",
    "local-ci",
    "yaml",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/karlhillx/bb-run"
Repository = "https://github.com/karlhillx/bb-run"
Issues = "https://github.com/karlhillx/bb-run/issues"
Changelog = "https://github.com/karlhillx/bb-run/blob/main/CHANGELOG.md"

[project.scripts]
bb-run = "bbrun.cli:main"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
]
dev = [
    { include-group = "test" },
    "ruff>=0.16",
    "ty>=0.0.75",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["bbrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["bbrun"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
